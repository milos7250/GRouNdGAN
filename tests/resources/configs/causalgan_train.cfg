[EXPERIMENT]
output directory = ${PYTEST_OUTPUT_DIR}
device
checkpoint ; set value to use a trained model to generate synthetic datasets or resume training
compile modules = False ; whether to compile the generator and critic modules with torch.compile for faster training. 

    [Preprocessing]
    library size = 20000 ; library size used for library-size normalization
    highly variable number = 1000 ; number of highly variable genes to identify

    [Data]
    train = ${PYTEST_TRAIN_FILE}
    validation = ${PYTEST_VALID_FILE}
    test = ${PYTEST_TEST_FILE}
    causal graph = ${PYTEST_CAUSAL_GRAPH_FILE}
    number of genes = 991
    
    [Generation]
    number of cells to generate = 10000

    [Model]
    type = causal GAN ; Non-conditional single-cell RNA-seq GAN
    noise per gene = 1
    depth per gene = 1
    width per gene = 1
    critic layers = 128 64
    labeler layers = 128 128
    latent dim = 10 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty
    
    [Training]
    batch size = 16 
    critic iterations = 2 ; iterations to train the critic for each iteration of the generator
    maximum steps = 8
    labeler and antilabeler training intervals = 2

        [Optimizer]
        ; coefficients used for computing running averages of gradient and its square 
        beta1 = 0.5
        beta2 = 0.9

        [Learning Rate]
        generator initial = 0.0001
        generator final = 0.00001
        critic initial = 0.0001
        critic final = 0.00001
        labeler = 0.0001
        antilabeler = 0.0001

        [Logging]
        summary frequency = 1
        plot frequency = 2
        save frequency = 3
        rf auroc frequency = 5
    
    [CC Model]
    generator layers = 64 128
    critic layers = 128 64
    latent dim = 10 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty
    checkpoint ; set value to use a trained model to generate synthetic datasets, leave blank to train the CC model from scratch
    
    [CC Training]
    batch size = 16 
    critic iterations = 2 ; iterations to train the critic for each iteration of the generator
    maximum steps = 8

        [CC Optimizer]
        ; coefficients used for computing running averages of gradient and its square 
        beta1 = 0.5
        beta2 = 0.9

        [CC Learning Rate]
        generator initial = 0.0001
        generator final = 0.00001
        critic initial = 0.0001
        critic final = 0.00001

        [CC Logging]
        summary frequency = 1
        plot frequency = 2
        save frequency = 3
        rf auroc frequency = 5
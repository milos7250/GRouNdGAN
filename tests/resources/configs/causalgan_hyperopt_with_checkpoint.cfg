[EXPERIMENT]
output directory = ${PYTEST_OUTPUT_DIR}
device
checkpoint ; set value to use a trained model to generate synthetic datasets or resume training
compile modules = False ; whether to compile the generator and critic modules with torch.compile for faster training. 

    [Preprocessing]
    library size = 20000 ; library size used for library-size normalization
    highly variable number = 1000 ; number of highly variable genes to identify

    [Data]
    train = ${PYTEST_TRAIN_FILE}
    validation = ${PYTEST_VALID_FILE}
    test = ${PYTEST_TEST_FILE}
    causal graph = ${PYTEST_CAUSAL_GRAPH_FILE}
    number of genes = 991
    library size = 20_000
    
    [Generation]
    number of cells to generate = 10_000

    [Model]
    type = causal GAN ; Non-conditional single-cell RNA-seq GAN
    noise per gene = 1
    depth per gene
    width per gene = 1
    critic layers
    labeler layers
    latent dim = 10
    lambda 
    
    [Training]
    batch size 
    critic iterations 
    maximum steps = 110
    labeler and antilabeler training intervals 

        [Optimizer]
        ; coefficients used for computing running averages of gradient and its square 
        beta1 
        beta2 

        [Learning Rate]
        generator initial
        generator final = 1e-6
        critic initial
        critic final = 1e-6
        labeler
        antilabeler

        [Logging]
        summary frequency = 10
        plot frequency = 25
        save frequency = 50
        rf auroc frequency = 50
    
    [CC Model]
    type = GAN ; Non-conditional single-cell RNA-seq GAN
    generator layers = 64 128
    latent dim = 10 ; noise vector dimensions
    lambda = 10 ; regularization hyper-parameter for gradient penalty
    checkpoint = ${PYTEST_CC_CHECKPOINT_FILE} ; set value to use a trained model to generate synthetic datasets, leave blank to train the CC model from scratch

[Hyperparameter Optimization]
number of trials = 2
storage ;= postgresql://mmicik:TyBudesOratZa5KorunNaMojomPoli!@n24-64-384-gunn:5432/optuna ; default is a local sqlite database in the output directory
study name = causalgan_test ; default is optuna_gan_study for GANs, optuna_causalgan_study for CausalGANs
worker id environment variable = SLURM_ARRAY_TASK_ID ; environment variable to use for worker identification in distributed hyperparameter optimization    

    [HO Model]
    depth per gene = (1 2) ; i.e first layer can have 128 to 384 neurons, second layer can have 384 to 768 neurons, third layer can have 768 to 1280 neurons
    critic layers = (64 48) (48 32) (32 16) ; i.e first layer can have 768 to 1280 neurons, second layer can have 384 to 768 neurons, third layer can have 128 to 384 neurons
    labeler layers = (64 48) (48 32) (32 16) ; i.e first layer can have 768 to 1280 neurons, second layer can have 384 to 768 neurons, third layer can have 128 to 384 neurons
    latent dim
    lambda = (1 20) ; regularization hyper-parameter for gradient penalty

    [HO Training]
    batch size = (16 32)
    critic iterations = (1 10)
    labeler and antilabeler training intervals = (1 2)
    
    [HO Optimizer]
    ; coefficients used for computing running averages of gradient and its square
    beta1 = (0.5 0.99)
    beta2 = (0.9 0.9999)

    [HO Learning Rate]
    generator initial = (1e-2 1e-5)
    generator final
    critic initial = (1e-2 1e-5)
    critic final
    labeler = (1e-2 1e-5)
    antilabeler = (1e-2 1e-5)

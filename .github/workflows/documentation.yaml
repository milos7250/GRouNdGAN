name: Docs
on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - src/**
      - docker/Dockerfile
      - requirements*.txt
  workflow_dispatch:
permissions:
    actions: write
    contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build documentation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: docs
          tags: groundscale-docs:ci
          load: true
          cache-from: type=gha,scope=groundscale
          cache-to: type=gha,mode=max,scope=groundscale
      - name: Sphinx build
        run: |
          docker run --rm \
            --env PYTHONPATH=/groundscale/src \
            --volume "${GITHUB_WORKSPACE}/docs:/groundscale/docs" \
            groundscale-docs:ci \
            -b html \
            /groundscale/docs \
            /groundscale/docs/_build/html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          force_orphan: true
